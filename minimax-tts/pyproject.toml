[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-tts"
version = "0.1.0"
description = "Independent MiniMax text-to-speech CLI for agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.2,<0.29",
  "mutagen>=1.47,<2",
  "pydantic>=2.9,<3",
  "typer>=0.12.5,<0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
minimax-tts = "minimax_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
